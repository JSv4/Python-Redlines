[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-redlines"
dynamic = ["version", "optional-dependencies"]
description = "Open-source DOCX comparison tool to generate native Word tracked changes (redlines) in Python without MS Word dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = [
  "docx",
  "redline",
  "diff",
  "tracked-changes",
  "openxml",
  "word",
  "docx-comparison",
  "compare-word-documents",
  "track-changes-api",
  "python-docx-diff",
  "legal-tech",
  "docxodus",
]
authors = [
  { name = "John Scrudato IV" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "platformdirs>=3.0",
]

[project.urls]
Homepage = "https://github.com/JSv4/Python-Redlines"
Documentation = "https://jsv4.github.io/Python-Redlines/"
Demo = "https://redlines.opensource.legal"
Issues = "https://github.com/JSv4/Python-Redlines/issues"
Source = "https://github.com/JSv4/Python-Redlines"

[tool.hatch.version]
path = "src/python_redlines/__about__.py"

# All three packages release together. Generate exact companion pins from the
# same version source, including in editable installs and source distributions.
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/python_redlines"]
